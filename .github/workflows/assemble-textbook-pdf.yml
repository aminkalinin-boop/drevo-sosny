name: Assemble Drevo textbook PDFs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-textbook-pdf.yml'
      - 'uchebnik/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: textbook-pdf-gh-pages
  cancel-in-progress: false

jobs:
  build:
    name: Export illustrated textbook as PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout published book with all source images
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF rendering dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright pypdf
          python -m playwright install --with-deps chromium

      - name: Render all chapters and illustrations into PDFs
        run: python uchebnik/export_pdf.py

      - name: Publish PDF files without modifying the application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uchebnik/pdf/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "docs(book): publish illustrated PDF volumes"
            git push origin HEAD:gh-pages
          fi

      - name: Upload PDF export artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drevo-textbook-pdf
          path: uchebnik/pdf/*.pdf
          if-no-files-found: warn
