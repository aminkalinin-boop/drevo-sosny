<text x="136" y="396.7" font-size="14.5" text-anchor="middle" fill="#173a1d">Целлюлоза, танины</text>
<text x="136" y="413.7" font-size="14.5" text-anchor="middle" fill="#173a1d">⇄ спецодежда, сукна</text>
