<text x="568" y="708.8" font-size="14.0" text-anchor="middle" fill="#173a1d">Синтетические волокна</text>
<text x="568" y="725.3" font-size="14.0" text-anchor="middle" fill="#173a1d">⇄ спецодежда, сорбенты</text>
