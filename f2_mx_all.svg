<text x="1000" y="396.9" font-size="13.0" text-anchor="middle" fill="#173a1d">Дизель, газ → удобрения</text>
<text x="1000" y="412.4" font-size="13.0" text-anchor="middle" fill="#173a1d">⇄ биогаз, этанол</text>
