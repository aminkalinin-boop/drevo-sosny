/* Layout: шапка с поиском и вкладками; экран одного уровня (путь сверху, карточки детей), справа на широком экране — дерево раздела */
:root{
  --bg:#edf0ea; --panel:#fbfcf9; --fg:#1d2820; --muted:#5b695e; --line:#c5cfc6; --trunk:#8a6a4f;
  --live:#2f6b3f; --live-bg:#dcebdf; --part:#7b3f24; --part-bg:#f1ddd0; --proc:#46525c; --proc-bg:#e2e7ea;
  --prod:#865608; --prod-bg:#f5e5c2; --final:#23507a; --final-bg:#dbe7f3; --waste:#6e4a36; --waste-bg:#e8dcd2; --idea:#7a3f8c;
  --place:#5b3f86; --place-bg:#e7dff3; --doc:#6b5a1e; --doc-bg:#efe9cf; --tech:#1f5f6a; --tech-bg:#d8eaee;
  --tool:#3d4a57; --tool-bg:#e9edf1; --accent:#b8740f; --hl:#fff1b8; --head:#1f4a2c; --head-fg:#eef4ef;
  --f-disp:"PT Serif",Georgia,"Times New Roman",serif; --f-body:"PT Sans","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131915; --panel:#1b231e; --fg:#e3eae4; --muted:#9aa89d; --line:#34433a; --trunk:#b08b6b;
  --live:#8fcf9d; --live-bg:#1e3326; --part:#eba98a; --part-bg:#3a2419; --proc:#b8c3cc; --proc-bg:#262d33;
  --prod:#f0c270; --prod-bg:#382c15; --final:#9cc6f0; --final-bg:#1a2c40; --waste:#dcb49c; --waste-bg:#352820; --idea:#d4a6e6;
  --place:#c8b2f0; --place-bg:#2c2240; --doc:#e3d08a; --doc-bg:#332d14; --tech:#8fd3e0; --tech-bg:#16303a;
  --tool:#c5d0db; --tool-bg:#252d35; --accent:#e9a73b; --hl:#5a4a12; --head:#10261a; --head-fg:#e3eae4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131915; --panel:#1b231e; --fg:#e3eae4; --muted:#9aa89d; --line:#34433a; --trunk:#b08b6b;
  --live:#8fcf9d; --live-bg:#1e3326; --part:#eba98a; --part-bg:#3a2419; --proc:#b8c3cc; --proc-bg:#262d33;
  --prod:#f0c270; --prod-bg:#382c15; --final:#9cc6f0; --final-bg:#1a2c40; --waste:#dcb49c; --waste-bg:#352820; --idea:#d4a6e6;
  --place:#c8b2f0; --place-bg:#2c2240; --doc:#e3d08a; --doc-bg:#332d14; --tech:#8fd3e0; --tech-bg:#16303a;
  --tool:#c5d0db; --tool-bg:#252d35; --accent:#e9a73b; --hl:#5a4a12; --head:#10261a; --head-fg:#e3eae4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);padding-inline:0;padding-block:0 40px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
header.top{background:var(--head);color:var(--head-fg);padding-block:14px 0}
header.top .wrap{display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font:700 1.7rem/1.1 var(--f-disp);margin:0}
.author{font-size:.85rem;opacity:.8}
.search{position:relative}
.search input{width:100%;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid transparent;background:var(--panel);color:var(--fg)}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.22);max-height:65vh;overflow:auto;z-index:60;padding:6px}
.results .rg{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 8px 2px}
.results button{display:block;width:100%;text-align:left;font:inherit;background:none;border:none;color:var(--fg);padding:7px 8px;border-radius:8px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--bg)}
.results small{color:var(--muted)}
.sector{display:flex;gap:6px;flex-wrap:wrap}
.sector button{font:inherit;font-size:.9rem;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--head-fg);cursor:pointer}
.sector button[aria-pressed="true"]{background:var(--head-fg);color:var(--head)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:inherit;font-weight:700;background:none;border:none;border-bottom:3px solid transparent;color:var(--head-fg);opacity:.75;padding:8px 11px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{opacity:1;border-color:var(--accent)}
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:8px 16px;display:flex;align-items:center;gap:8px}
.back{font:inherit;font-size:1.3rem;line-height:1;width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.back:disabled{opacity:.35;cursor:default}
.crumbs{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none;white-space:nowrap;min-width:0;flex:1;font-size:.9rem}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{font:inherit;background:none;border:none;color:var(--muted);padding:4px 2px;cursor:pointer}
.crumbs button:last-child{color:var(--fg);font-weight:700}
.crumbs span{color:var(--muted)}
.treebtn{font:inherit;font-size:.85rem;flex:none;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}

.screen{min-width:0;max-width:780px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 8px}
.side h3{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2px 6px 8px}
.kind{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.screen h2{font:700 1.75rem/1.12 var(--f-disp);margin:2px 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 12px;font-size:1.05rem}
.screen p{margin:0 0 10px;max-width:68ch}
.screen h3.sec{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:18px 0 8px}
.screen ul{margin:0;padding-left:20px;max-width:68ch}.screen li{margin-bottom:6px}
.names{font-size:.94rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:10px 0 12px;max-width:68ch}
.how{border-left:3px solid var(--accent);padding-left:12px}
.photo{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 10px}
.photo img{display:block;width:100%;height:auto}
.hs{position:absolute;border:2px dashed transparent;border-radius:10px;background:transparent;cursor:pointer;padding:0}
.hs.term{border-bottom:2px dashed transparent}
.hs:hover,.hs:focus-visible{border-color:#b8740f;background:rgba(184,116,15,.12);outline:none}
.cimg.wide{max-width:100%}
.tn.tt{color:var(--tool);font-size:.84rem}
.cimg{display:block;width:100%;max-width:420px;height:auto;border-radius:12px;border:1px solid var(--line);margin:6px 0 12px}
.note{font-size:.88rem;color:var(--muted);margin:0 0 6px}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;min-height:56px}
.item:hover{border-color:var(--accent)}
.item .tx{flex:1;min-width:0}
.item b{display:block;font-weight:700;line-height:1.25}
.item small{display:block;color:var(--muted);line-height:1.3;margin-top:2px}
.item .go{flex:none;color:var(--muted);font-size:.9rem;white-space:nowrap}
.item.thumb img{width:52px;height:52px;object-fit:cover;border-radius:8px;flex:none}
.k-forest{border-left-color:var(--live)}.k-live{border-left-color:var(--live)}.k-part{border-left-color:var(--part)}.k-proc{border-left-color:var(--proc);border-left-style:dashed}
.k-prod{border-left-color:var(--prod)}.k-final{border-left-color:var(--final)}.k-waste{border-left-color:var(--waste)}.k-idea{border-left-color:var(--idea);border-left-style:dotted}.k-place{border-left-color:var(--place)}
.k-doc{border-left-color:var(--doc)}.k-info{border-left-color:var(--line)}.k-tech{border-left-color:var(--tech)}.k-tool{border-left-color:var(--tool)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button.chip{font:inherit;font-size:.88rem;cursor:pointer;border-radius:8px;padding:5px 10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);text-align:left}
button.chip.tl{background:var(--tool-bg);color:var(--tool)}
button.chip.lk{border-style:dashed;border-color:var(--tech);color:var(--tech);background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted);margin:18px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:6px;height:14px;border-radius:2px;display:inline-block}
button.term{font:inherit;background:none;border:none;padding:0;color:inherit;cursor:help;border-bottom:1.5px dotted var(--accent);text-align:inherit}
button.nlink{font:inherit;background:none;border:none;padding:0;color:var(--tech);cursor:pointer;text-decoration:underline;text-align:inherit}
.pop{position:fixed;z-index:70;max-width:340px;background:var(--panel);color:var(--fg);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.2);font-size:.93rem}
.pop b{display:block;font-family:var(--f-disp);font-size:1.05rem;margin-bottom:2px}
/* дерево обзора */
.r{display:flex;align-items:stretch;min-height:30px}
.g,.el{width:16px;flex:none;position:relative}
.g.v::before,.el::before{content:"";position:absolute;left:7px;top:0;bottom:0;border-left:2px solid var(--trunk)}
.el.l::before{bottom:auto;height:15px}
.el::after{content:"";position:absolute;left:7px;top:15px;width:9px;border-top:2px solid var(--trunk)}
.rb{display:flex;align-items:center;gap:4px;padding-block:2px;min-width:0;flex:1}
.car{font:inherit;width:20px;height:20px;border:none;background:none;color:var(--trunk);cursor:pointer;padding:0;font-size:.75rem;flex:none}
.car.none{visibility:hidden}
.tn{font:inherit;font-size:.88rem;background:none;border:none;color:var(--fg);text-align:left;padding:2px 4px;border-radius:6px;cursor:pointer;line-height:1.25}
.tn.on{background:var(--hl);font-weight:700}.tn.path{font-weight:700}
.quiz-box,.glbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:780px;margin-top:14px}
.qh{font:700 1.2rem/1.2 var(--f-disp);margin:0 0 10px}
.lead-s{color:var(--muted);margin:14px 0 0;max-width:75ch}
.qscope{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-bottom:16px}
.qchk,.qradio{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.qchk small{flex-basis:100%;color:var(--muted);margin-left:26px}
.qchk input,.qradio input{width:18px;height:18px;accent-color:var(--accent)}
.qcount{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.qact{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.qbtn{font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.qbtn.primary{background:var(--live);border-color:var(--live);color:var(--panel)}
.qprog{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--muted);flex-wrap:wrap}
.qbar{height:6px;background:var(--bg);border-radius:3px;margin:6px 0 14px;overflow:hidden}.qbar i{display:block;height:100%;background:var(--accent)}
.qprompt{font-size:1.1rem;margin:0 0 14px}.qprompt q{display:block;margin-top:8px;padding:10px 12px;background:var(--bg);border-radius:8px;quotes:none;font-size:1rem}
.qopts{display:flex;flex-direction:column;gap:8px}
.qopt{font:inherit;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;min-height:48px}
.qopt.right{border-color:var(--live);background:var(--live-bg);color:var(--live);font-weight:700}
.qopt.wrong{border-color:var(--part);background:var(--part-bg);color:var(--part)}
.qopt:disabled{cursor:default}
.qfb{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.okm{color:var(--live);font-weight:700}.errm{color:var(--part);font-weight:700}
.qwrong li{margin-bottom:6px}
.gl{columns:2 320px;column-gap:28px}.gl div{break-inside:avoid;margin-bottom:10px}.gl b{font-family:var(--f-disp)}
.glbox input{width:100%;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);margin-bottom:12px}
.foot{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:1000px){
  .layout{grid-template-columns:1fr}
  .side{display:none;position:static;max-height:none}
  .side.open{display:block}
}
@media (min-width:1001px){.treebtn{display:none}}
</style>

<script>
const K={forest:"Раздел",live:"Живое / целое",part:"Часть дерева",proc:"Процесс",prod:"Сырьё, полуфабрикат",final:"Готовая продукция",waste:"Остатки, побочное, риски",place:"Место, объект",idea:"Идея, в теории",doc:"Документы, право",info:"Справка",tech:"Техника"};
const SCH=[
 {id:"conif",t:"Хвойные",root:"con_root",sec:"lpk"},
 {id:"decid",t:"Лиственные",root:"dc_root",sec:"lpk"},
 {id:"forest",t:"Лес",root:"f_root",sec:"lpk"},
 {id:"otvod",t:"Отвод делянки",root:"o_root",sec:"lpk"},
 {id:"zag",t:"Лесозаготовка",root:"z_root",sec:"lpk"},
 {id:"vost",t:"Лесовосстановление",root:"v_root",sec:"lpk"},
 {id:"derevo",t:"Деревообработка",root:"d_root",sec:"lpk"},
 {id:"chl",t:"Переделы",root:"x_root",sec:"lpk"},
 {id:"cyl",t:"Идеальный цикл",root:"il_root",sec:"lpk"},
 {id:"real",t:"Реализация",root:"r_root",sec:"lpk"},
 {id:"uis",t:"ЛПК в УИС",root:"u_root",sec:"lpk"},
 {id:"tech",t:"Техника",root:"tech_root",sec:"lpk"},
 {id:"plant",t:"Растениеводство",root:"pl_root",sec:"apk"},
 {id:"anim",t:"Животноводство",root:"an_root",sec:"apk"},
 {id:"agro",t:"Агротехнологии",root:"ag_root",sec:"apk"},
 {id:"newtech",t:"Новые технологии",root:"nt_root",sec:"apk"},
 {id:"proc",t:"Переработка",root:"pr_root",sec:"apk"},
 {id:"cha",t:"Переделы",root:"y_root",sec:"apk"},
 {id:"cya",t:"Идеальный цикл",root:"ia_root",sec:"apk"},
 {id:"econ",t:"Экономика и рынок",root:"ec_root",sec:"apk"},
 {id:"auis",t:"АПК в УИС",root:"au_root",sec:"apk"},
 {id:"atech",t:"Техника АПК",root:"at_root",sec:"apk"},
 {id:"mix",t:"Пересечения отраслей",root:"mx_root",sec:"mix"}
];
const SECS={lpk:"ЛПК · лес",apk:"АПК · село",mix:"ЛПК + АПК"};const SECSH={lpk:"ЛПК",apk:"АПК",mix:"ЛПК + АПК"};let sector="lpk";
const EXTRA=[{id:"quiz",t:"Тест"},{id:"gloss",t:"Словарь"}];
/* связи */
const P={};Object.keys(N).forEach(id=>(N[id].c||[]).forEach(c=>{if(!P[c])P[c]=id}));
const ROOTTAB={};SCH.forEach(s=>ROOTTAB[s.root]=s.id);
function tabOf(id){let x=id;while(P[x])x=P[x];return ROOTTAB[x]}
function pathOf(id){const a=[id];let x=id;while(P[x]){x=P[x];a.unshift(x)}return a}
const USED={},GROUPS={};Object.keys(N).forEach(id=>(N[id].tl||[]).forEach(t=>{const m=N[id].k==="tech"?GROUPS:USED;(m[t]=m[t]||[]).includes(id)||(m[t]=m[t]||[]).push(id)}));
const cap=s=>s[0].toUpperCase()+s.slice(1);
function plain(s){return (s||"").replace(/\{\{([^}|]+)(?:\|([^}]+))?\}\}/g,(m,k,d)=>d||k).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,k,d)=>d||k).replace(/<[^>]+>/g,"")}
function rich(s){if(!s)return"";
 return s.replace(/\{\{([^}|]+)(?:\|([^}]+))?\}\}/g,(m,k,d)=>G[k]?`<button type="button" class="term" data-t="${k}">${d||k}</button>`:(d||k))
  .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,id,d)=>N[id]?`<button type="button" class="nlink" data-go="${id}">${d||plain(N[id].t)}</button>`:T[id]?`<button type="button" class="nlink" data-tool="${id}">${d||T[id].t}</button>`:(d||id))}
const title=id=>id.startsWith("t:")?T[id.slice(2)].t:plain(N[id].t);
function firstSent(s,max=140){s=plain(s).replace(/\s+/g," ").trim();const m=s.match(/^.{20,}?[.!?](\s|$)/);let r=m?m[0].trim():s;return r.length>max?r.slice(0,max).replace(/\s\S*$/,"")+"…":r}
/* состояние */
const ST={};SCH.forEach(s=>ST[s.id]=[s.root]);
let cur="conif";
const treeOpen={};SCH.forEach(s=>treeOpen[s.id]=new Set());
/* вкладки и панели */
const tabs=document.getElementById("tabs"),panes=document.getElementById("panes");
tabs.innerHTML=[...SCH,...EXTRA].map(s=>`<button role="tab" data-tab="${s.id}" ${s.sec?`data-sec="${s.sec}"`:""} aria-selected="${s.id===cur}" ${s.sec&&s.sec!==sector?"hidden":""}>${s.t}</button>`).join("");
document.getElementById("sector").innerHTML=Object.entries(SECS).map(([k,v])=>`<button type="button" data-secsel="${k}" aria-pressed="${k===sector}">${v}</button>`).join("");
function setSector(sec){if(sec===sector)return;sector=sec;document.querySelectorAll("#tabs button[data-sec]").forEach(b=>b.hidden=b.dataset.sec!==sec);document.querySelectorAll("#sector button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.secsel===sec))}
panes.innerHTML=SCH.map(s=>`<section id="pane-${s.id}" ${s.id===cur?"":"hidden"}>
 <div class="navbar"><button type="button" class="back" data-back aria-label="Назад">‹</button><div class="crumbs" id="cr-${s.id}"></div><button type="button" class="treebtn" data-tree="${s.id}">Дерево</button></div>
 <div class="layout"><article class="screen" id="sc-${s.id}"></article><aside class="side" id="sd-${s.id}"><h3>Всё дерево раздела</h3><div id="tr-${s.id}"></div></aside></div></section>`).join("")+
 `<section id="pane-quiz" hidden></section><section id="pane-gloss" hidden><div class="glbox"><input id="gq" type="search" placeholder="Найти термин" aria-label="Поиск по словарю"><div class="gl" id="gl"></div></div></section>`;
/* экран */
const kidCount=id=>(N[id].c||[]).length+((N[id].k==="tech"&&N[id].tl)?N[id].tl.length:0);
function item(id){const n=N[id],c=kidCount(id);
 return `<button type="button" class="item k-${n.k}${n.im?" thumb":""}" data-nav="${id}">${n.im?`<img src="${n.im}" alt="" loading="lazy">`:""}<span class="tx"><b>${plain(n.t)}</b>${n.s?`<small>${n.s}</small>`:""}</span><span class="go">${c?c+" ›":"›"}</span></button>`}
function toolItem(t){const x=T[t];return `<button type="button" class="item k-tool${x.im?" thumb":""}" data-tool="${t}">${x.im?`<img src="${x.im}" alt="" loading="lazy">`:""}<span class="tx"><b>${x.t}</b><small>${firstSent(x.w)}</small></span><span class="go">›</span></button>`}
const lnItem=id=>`<button type="button" class="item k-${N[id].k}" data-go="${id}"><span class="tx"><b>${plain(N[id].t)}</b><small>${(t=>`${SECSH[t.sec]} · раздел «${t.t}»`)(SCH.find(s=>s.id===tabOf(id)))}</small></span><span class="go">→</span></button>`;
function hsBtn([i,x,y,w,hh]){const st=`style="left:${x}%;top:${y}%;width:${w}%;height:${hh}%"`;
 if(i.startsWith("g:")){const k=i.slice(2);return G[k]?`<button type="button" class="hs term" data-t="${k}" ${st} aria-label="${k}"></button>`:""}
 if(i.startsWith("t_"))return T[i]?`<button type="button" class="hs" data-tool="${i}" ${st} aria-label="${T[i].t}"></button>`:"";
 return N[i]?`<button type="button" class="hs" data-go="${i}" ${st} aria-label="${plain(N[i].t)}"></button>`:""}
function photoHtml(src,hs,alt){return `<div class="photo"><img src="${src}" alt="${alt||""}" loading="lazy">${(hs||[]).map(hsBtn).join("")}</div>`}
function nodeScreen(id,tab){const n=N[id];let h="";
 const isRoot=ROOTTAB[id];
 if(isRoot&&PH[tab]){h+=photoHtml(PH[tab],HSX[tab],"Иллюстрация к разделу")+`<p class="note">Нажимай на подписи и предметы на картинке.</p>`}
 h+=`<div class="kind">${K[n.k]||""}</div><h2>${rich(n.t)}</h2>`;
 if(n.s)h+=`<p class="lead">${n.s}</p>`;
 if(n.im&&!(n.pics&&n.pics.length))h+=`<img class="cimg" src="${n.im}" alt="${plain(n.t)}" onload="if(this.naturalWidth>this.naturalHeight*1.2)this.classList.add('wide')">`;
 if(n.pics&&n.pics.length){const any=n.pics.some(p=>p.hs&&p.hs.length);h+=n.pics.map(p=>photoHtml(p.src,p.hs,plain(n.t))).join("");if(any)h+=`<p class="note">На картинке можно нажимать на подписи и плитки.</p>`}
 if(n.n)h+=`<div class="names"><b>Как называют.</b> ${rich(n.n)}</div>`;
 if(n.w)h+=`<p>${rich(n.w)}</p>`;
 if(n.h)h+=`<h3 class="sec">Как получают / как делают</h3><p class="how">${rich(n.h)}</p>`;
 if(n.f)h+=`<h3 class="sec">Подробности</h3><ul>${n.f.map(x=>`<li>${rich(x)}</li>`).join("")}</ul>`;
 if(n.y)h+=`<h3 class="sec">${n.c?"Ещё":"Что из этого получают"}</h3><ul>${n.y.map(x=>`<li>${rich(x)}</li>`).join("")}</ul>`;
 if(n.c&&n.c.length){const lbl=["part","live","prod","waste","final"].includes(n.k)&&["conif","decid","plant","anim","chl","cha"].includes(tab)?"Что из этого получают":"Дальше";h+=`<h3 class="sec">${lbl} · ${n.c.length}</h3><div class="items">${n.c.map(item).join("")}</div>`}
 if(n.tl&&n.tl.length){h+=n.k==="tech"?`<h3 class="sec">Оборудование · ${n.tl.length}</h3><div class="items">${n.tl.map(toolItem).join("")}</div>`:`<h3 class="sec">Инструменты и оборудование</h3><div class="chips">${n.tl.map(t=>`<button type="button" class="chip tl" data-tool="${t}">${T[t].t}</button>`).join("")}</div>`}
 if(n.ln){const l=n.ln.filter(x=>N[x]);if(l.length)h+=`<h3 class="sec">Связано в других разделах</h3><div class="items">${l.map(lnItem).join("")}</div>`}
 if(isRoot)h+=`<div class="legend">${Object.entries(K).map(([k,v])=>`<span><i style="background:var(--${k==="info"?"line":k==="forest"?"live":k})"></i>${v}</span>`).join("")}</div>`;
 return h}
function toolScreen(t){const x=T[t];let h=`<div class="kind">Оборудование · ${x.g}</div><h2>${x.t}</h2>${x.im?`<img class="cimg" src="${x.im}" alt="${x.t}" onload="if(this.naturalWidth>this.naturalHeight*1.2)this.classList.add('wide')">`:""}<p>${rich(x.w)}</p>`;
 if(x.how)h+=`<h3 class="sec">Как устроено и работает</h3><p class="how">${rich(x.how)}</p>`;
 if(x.use)h+=`<h3 class="sec">Для чего</h3><p>${rich(x.use)}</p>`;
 if(x.perf)h+=`<h3 class="sec">Производительность и цифры</h3><p>${rich(x.perf)}</p>`;
 if(x.f)h+=`<h3 class="sec">Подробности</h3><ul>${x.f.map(i=>`<li>${rich(i)}</li>`).join("")}</ul>`;
 if(GROUPS[t])h+=`<h3 class="sec">В каталоге техники</h3><div class="chips">${GROUPS[t].map(g=>`<button type="button" class="chip lk" data-go="${g}">${plain(N[g].t)}</button>`).join("")}</div>`;
 if(USED[t])h+=`<h3 class="sec">Где применяется</h3><div class="items">${USED[t].map(lnItem).join("")}</div>`;
 return h}
function render(tab,scroll=true){const st=ST[tab],top=st[st.length-1];
 document.getElementById("sc-"+tab).innerHTML=top.startsWith("t:")?toolScreen(top.slice(2)):nodeScreen(top,tab);
 document.getElementById("cr-"+tab).innerHTML=st.map((x,i)=>(i?"<span>›</span>":"")+`<button type="button" data-crumb="${i}">${title(x)}</button>`).join("");
 const cr=document.getElementById("cr-"+tab);cr.scrollLeft=cr.scrollWidth;
 document.querySelector(`#pane-${tab} .back`).disabled=st.length<2;
 const last=[...st].reverse().find(x=>!x.startsWith("t:"));pathOf(last).forEach(x=>treeOpen[tab].add(x));renderTree(tab,last);
 if(scroll){const nb=document.querySelector(`#pane-${tab} .navbar`);const y=nb.getBoundingClientRect().top+scrollY-0;if(scrollY>y)scrollTo({top:y,behavior:"auto"})}}
/* дерево обзора */
function renderTree(tab,sel){const s=SCH.find(x=>x.id===tab),open=treeOpen[tab],path=new Set(pathOf(sel));
 const st=ST[tab],top=st[st.length-1],selTool=top.startsWith("t:")?top.slice(2):null;
 const ents=id=>[...(N[id].c||[]).map(c=>["n",c]),...(N[id].k==="tech"?(N[id].tl||[]).map(t=>["t",t]):[])];
 const lines=(d,gs,last)=>{let h="";gs.forEach(v=>h+=`<i class="g${v?" v":""}"></i>`);if(d>0)h+=`<i class="el${last?" l":""}"></i>`;return h};
 const row=(id,d,gs,last)=>{const kids=ents(id),o=open.has(id);let h=`<div class="r">`+lines(d,gs,last);
  h+=`<div class="rb"><button type="button" class="car${kids.length?"":" none"}" data-tt="${id}" aria-label="${o?"Свернуть":"Развернуть"}">${kids.length?(o?"▾":"▸"):""}</button><button type="button" class="tn${id===sel&&!selTool?" on":path.has(id)?" path":""}" data-go="${id}">${plain(N[id].t)}</button></div></div>`;
  if(o){const g2=d===0?[]:[...gs,!last];kids.forEach(([k,c],i)=>{const l=i===kids.length-1;h+=k==="n"?row(c,d+1,g2,l):`<div class="r">${lines(d+1,g2,l)}<div class="rb"><span class="car none"></span><button type="button" class="tn tt${c===selTool&&id===sel?" on":""}" data-tool="${c}" data-grp="${id}">${T[c].t}</button></div></div>`})}
  return h};
 document.getElementById("tr-"+tab).innerHTML=row(s.root,0,[],true)}
/* навигация */
function snapshot(){return {tab:cur,st:ST[cur]?ST[cur].slice():null}}
const hkey=s=>s?s.tab+"|"+(s.st||[]).join("/"):"";
function pushHist(){try{const prev=hkey(history.state),now=snapshot();if(hkey(now)===prev)return;history.pushState(Object.assign(now,{prev}),"")}catch(e){}}
function openTab(t,push=true){const sx=SCH.find(x=>x.id===t);if(sx)setSector(sx.sec);cur=t;document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));[...SCH,...EXTRA].forEach(s=>document.getElementById("pane-"+s.id).hidden=s.id!==t);
 const b=document.querySelector(`#tabs button[data-tab="${t}"]`);if(b)b.scrollIntoView({inline:"nearest",block:"nearest"});if(ST[t])render(t,false);if(push)pushHist()}
function go(id){const t=tabOf(id);if(!t)return;ST[t]=pathOf(id);if(t!==cur)openTab(t,false);render(t);pushHist()}
function nav(id){const st=ST[cur];if(st[st.length-1].startsWith("t:")){ST[cur]=pathOf(id);if(tabOf(id)!==cur){go(id);return}}else if(P[id]===st[st.length-1])st.push(id);else{go(id);return}render(cur);pushHist()}
function openTool(t){if(!ST[cur]){openTab("tech",false)}const st=ST[cur];if(st[st.length-1].startsWith("t:"))st.pop();st.push("t:"+t);render(cur);pushHist()}
addEventListener("popstate",e=>{const s=e.state;if(!s)return;if(s.st)ST[s.tab]=s.st.slice();openTab(s.tab,false)});
/* поиск */
const q=document.getElementById("q"),res=document.getElementById("res");
const IDX=[...Object.keys(N).filter(id=>tabOf(id)).map(id=>({type:"n",id,t:plain(N[id].t),x:(plain(N[id].s)+" "+plain(N[id].n)+" "+plain(N[id].w)+" "+(N[id].f||[]).map(plain).join(" ")+" "+(N[id].y||[]).map(plain).join(" ")).toLowerCase()})),
 ...Object.keys(T).map(id=>({type:"t",id,t:T[id].t,x:(plain(T[id].w)+" "+(T[id].how||"")+" "+(T[id].use||"")).toLowerCase()})),
 ...Object.keys(G).map(k=>({type:"g",id:k,t:cap(k),x:G[k].toLowerCase()}))];
function search(s){s=s.trim().toLowerCase();if(s.length<2){res.hidden=true;return}
 const sc=it=>{const tl=it.t.toLowerCase();return tl.startsWith(s)?3:tl.includes(s)?2:it.x.includes(s)?1:0};
 const hits=IDX.map(it=>[sc(it),it]).filter(a=>a[0]).sort((a,b)=>b[0]-a[0]||a[1].t.length-b[1].t.length).slice(0,40).map(a=>a[1]);
 if(!hits.length){res.innerHTML=`<div class="rg">Ничего не нашлось</div>`;res.hidden=false;return}
 const grp={n:[],t:[],g:[]};hits.forEach(h=>grp[h.type].push(h));
 res.innerHTML=(grp.n.length?`<div class="rg">Разделы и пункты</div>`+grp.n.map(h=>`<button type="button" data-go="${h.id}" data-res>${h.t}<br><small>${SCH.find(s=>s.id===tabOf(h.id)).t}${P[h.id]?" · "+plain(N[P[h.id]].t):""}</small></button>`).join(""):"")+
  (grp.t.length?`<div class="rg">Техника</div>`+grp.t.map(h=>`<button type="button" data-tool="${h.id}" data-res>${h.t}<br><small>${T[h.id].g}</small></button>`).join(""):"")+
  (grp.g.length?`<div class="rg">Словарь</div>`+grp.g.map(h=>`<button type="button" class="term" data-t="${h.id}" data-res>${h.t}<br><small>${firstSent(G[h.id],90)}</small></button>`).join(""):"");
 res.hidden=false}
q.addEventListener("input",()=>search(q.value));q.addEventListener("focus",()=>search(q.value));
/* словарь */
const GL=Object.keys(G).sort((a,b)=>a.localeCompare(b,"ru"));const gl=document.getElementById("gl");
function renderGl(f){gl.innerHTML=GL.filter(k=>!f||k.includes(f)||G[k].toLowerCase().includes(f)).map(k=>`<div><b>${cap(k)}</b> — ${G[k]}</div>`).join("")||"<p>Ничего не нашлось.</p>"}
renderGl("");document.getElementById("gq").addEventListener("input",e=>renderGl(e.target.value.trim().toLowerCase()));
/* клики */
const pop=document.getElementById("pop");
document.addEventListener("click",e=>{
 const t=e.target.closest("button.term");
 if(t){e.stopPropagation();const k=t.dataset.t;pop.innerHTML=`<b>${cap(k)}</b>${G[k]}`;pop.hidden=false;const r=t.getBoundingClientRect(),pw=Math.min(340,innerWidth-24);pop.style.width=pw+"px";pop.style.left=Math.min(Math.max(12,r.left),innerWidth-pw-12)+"px";const ph=pop.offsetHeight;pop.style.top=(r.bottom+8+ph>innerHeight?Math.max(8,r.top-ph-8):r.bottom+8)+"px";return}
 if(!e.target.closest("#pop"))pop.hidden=true;
 if(!e.target.closest(".search"))res.hidden=true;
 const inRes=!!e.target.closest("[data-res]");if(inRes){res.hidden=true;q.blur()}
 const sb=e.target.closest("[data-secsel]");if(sb){const f=SCH.find(x=>x.sec===sb.dataset.secsel);if(sb.dataset.secsel!==sector)openTab(f.id);return}
 const tab=e.target.closest("#tabs button");if(tab){openTab(tab.dataset.tab);return}
 if(e.target.closest("[data-back]")){if(ST[cur]&&ST[cur].length>1){const want=hkey({tab:cur,st:ST[cur].slice(0,-1)});let hs=null;try{hs=history.state}catch(x){}if(hs&&hs.prev===want){history.back()}else{ST[cur].pop();render(cur);try{history.replaceState(Object.assign(snapshot(),{prev:hs&&hs.prev}),"")}catch(x){}}}return}
 const cr=e.target.closest("[data-crumb]");if(cr){ST[cur]=ST[cur].slice(0,+cr.dataset.crumb+1);render(cur);pushHist();return}
 const tb=e.target.closest("[data-tree]");if(tb){document.getElementById("sd-"+tb.dataset.tree).classList.toggle("open");return}
 const tt=e.target.closest("[data-tt]");if(tt){const o=treeOpen[cur],id=tt.dataset.tt;o.has(id)?o.delete(id):o.add(id);const st=ST[cur];renderTree(cur,[...st].reverse().find(x=>!x.startsWith("t:")));return}
 const nv=e.target.closest("[data-nav]");if(nv){nav(nv.dataset.nav);return}
 const tl=e.target.closest("[data-tool]");if(tl&&inRes&&GROUPS[tl.dataset.tool]){const g=GROUPS[tl.dataset.tool][0],t=tabOf(g);ST[t]=pathOf(g).concat("t:"+tl.dataset.tool);openTab(t,false);render(t);pushHist();return}
 if(tl){if(tl.dataset.grp){ST[cur]=pathOf(tl.dataset.grp).concat("t:"+tl.dataset.tool);render(cur);pushHist();if(innerWidth<=1000)document.getElementById("sd-"+cur).classList.remove("open")}else openTool(tl.dataset.tool);return}
 const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);if(e.target.closest(".side")&&innerWidth<=1000)document.getElementById("sd-"+cur).classList.remove("open");return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){pop.hidden=true;res.hidden=true}});
addEventListener("scroll",()=>{pop.hidden=true},{passive:true});
SCH.forEach(s=>render(s.id,false));
try{history.replaceState(snapshot(),"")}catch(e){}
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude\.ai|claudeusercontent/.test(location.host)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
<script charset="utf-8" src="quiz.js"></script>
